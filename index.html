<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Kode Warna - Belajar Membaca</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .game-container {
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      font-size: 1.6rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* Landing Page Style */
    #landing-page {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .landing-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .input-name-box {
      font-size: 1.2rem;
      width: 80%;
      text-align: center;
      border: 3px solid #4A90E2;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 20px;
      outline: none;
    }

    /* Game Page Style */
    #game-page {
      display: none;
    }

    .greeting {
      font-size: 1.1rem;
      font-weight: bold;
      color: #4A90E2;
      margin-bottom: 10px;
    }

    .level-badge {
      display: inline-block;
      background-color: #ffb703;
      color: #333;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .key-section {
      background-color: #fafafa;
      border: 2px dashed #e0e0e0;
      border-radius: 16px;
      padding: 15px 10px;
      margin-bottom: 25px;
    }

    .key-title {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .key-board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .key-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .key-item span {
      margin-top: 4px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #333;
    }

    .question-section {
      margin-bottom: 20px;
    }

    .color-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
      min-height: 45px;
      align-items: center;
    }

    .equals {
      font-size: 2rem;
      font-weight: bold;
      color: #555;
      margin: 0 10px;
    }

    .answer-box {
      font-size: 1.6rem;
      width: 150px;
      text-align: center;
      border: 3px solid #4A90E2;
      border-radius: 12px;
      padding: 8px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: lowercase;
      outline: none;
      background-color: #f8fafc;
    }

    .action-btn {
      font-size: 1.1rem;
      padding: 12px 28px;
      background-color: #06d6a0;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #04b383;
      transition: all 0.1s;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #04b383;
    }

    #feedback {
      min-height: 28px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 15px;
    }

    /* On-Screen Keyboard */
    .keyboard-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .key-btn {
      background: #e9ecef;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      box-shadow: 0 3px 0 #ced4da;
    }

    .key-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .key-btn.del {
      background-color: #ff85a1;
      color: white;
      box-shadow: 0 3px 0 #e65c7b;
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- 1. LANDING PAGE -->
    <div id="landing-page">
      <div class="landing-icon">🎨📚</div>
      <h1>Game Kode Warna</h1>
      <p class="subtitle">Belajar Membaca Sambil Bermain Warna</p>
      
      <input type="text" id="player-name-input" class="input-name-box" placeholder="Ketik Nama Anak..." autocomplete="off">
      <button id="start-btn" class="action-btn">Mulai Bermain 🚀</button>
    </div>

    <!-- 2. GAME PAGE -->
    <div id="game-page">
      <div id="greeting-msg" class="greeting">Halo!</div>
      <div id="level-badge" class="level-badge">Level 1 - Kata 2-3 Huruf</div>

      <!-- Kunci Kode Warna -->
      <div class="key-section">
        <div class="key-title">Kunci Huruf Warna</div>
        <div id="color-key" class="key-board"></div>
      </div>

      <!-- Soal -->
      <div class="question-section">
        <div id="color-code-display" class="color-row"></div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
          <span class="equals">=</span>
          <input type="text" id="answer-input" class="answer-box" placeholder="..." readonly>
        </div>
        <div style="margin-top: 15px;">
          <button id="check-btn" class="action-btn">Cek Jawaban</button>
        </div>
      </div>

      <!-- Keyboard Layar (Huruf Diacak) -->
      <div id="keyboard" class="keyboard-container"></div>

      <!-- Feedback Hasil -->
      <div id="feedback"></div>
    </div>

  </div>

  <script>
    // Palette Warna Kontras Tinggi
    const colorPalette = [
      '#FFD166', // Kuning
      '#06D6A0', // Hijau
      '#118AB2', // Biru
      '#F8961E', // Oranye
      '#F72585', // Pink
      '#7209B7', // Ungu
      '#EF476F', // Merah Muda
      '#073B4C', // Biru Gelap
      '#9B5DE5', // Ungu Cerah
      '#11B5E4', // Cyan
      '#FF006E'  // Rose
    ];

    // Daftar Soal Bertahap
    const levels = [
      {
        name: "Level 1: Kata Pendek (2-3 Huruf)",
        words: ["ibu", "apa", "ada", "ani", "api", "uap"]
      },
      {
        name: "Level 2: Kata 4 Huruf Sederhana",
        words: ["baca", "buku", "bola", "kaki", "mata", "sapu", "cuci"]
      },
      {
        name: "Level 3: Kombinasi Lebih Bervariasi",
        words: ["peta", "rusa", "satu", "topi", "kura", "roda"]
      }
    ];

    let playerName = "";
    let currentLevelIndex = 0;
    let currentWordIndex = 0;
    let currentWord = "";
    let currentColorMap = {};

    // Element DOM
    const landingPage = document.getElementById('landing-page');
    const gamePage = document.getElementById('game-page');
    const playerNameInput = document.getElementById('player-name-input');
    const startBtn = document.getElementById('start-btn');
    const greetingMsg = document.getElementById('greeting-msg');
    
    const keyBoardEl = document.getElementById('color-key');
    const colorCodeDisplayEl = document.getElementById('color-code-display');
    const answerInputEl = document.getElementById('answer-input');
    const checkBtn = document.getElementById('check-btn');
    const feedbackEl = document.getElementById('feedback');
    const levelBadgeEl = document.getElementById('level-badge');
    const keyboardEl = document.getElementById('keyboard');

    // Helper: Pengacak Array (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Tombol Mulai (Landing Page -> Game Page)
    startBtn.addEventListener('click', () => {
      playerName = playerNameInput.value.trim() || "Anak Hebat";
      greetingMsg.textContent = `Halo, ${playerName}! Selamat Belajar! 🌟`;
      
      landingPage.style.display = 'none';
      gamePage.style.display = 'block';
      
      loadWord();
    });

    function loadWord() {
      const levelData = levels[currentLevelIndex];
      levelBadgeEl.textContent = levelData.name;
      currentWord = levelData.words[currentWordIndex];

      // Reset Input & Feedback
      answerInputEl.value = '';
      feedbackEl.textContent = '';

      // Dapatkan semua huruf unik dari kata saat ini
      const uniqueChars = Array.from(new Set(currentWord.split('')));
      
      // 1. ACAK PEMETAAN WARNA untuk huruf di soal ini
      const shuffledColors = shuffleArray(colorPalette);
      currentColorMap = {};
      uniqueChars.forEach((char, index) => {
        currentColorMap[char] = shuffledColors[index % shuffledColors.length];
      });

      // 2. ACAK URUTAN KUNCI WARNA di tampilan atas agar tidak berurutan mengikuti kata
      const shuffledKeyChars = shuffleArray(uniqueChars);
      keyBoardEl.innerHTML = '';
      shuffledKeyChars.forEach(char => {
        const item = document.createElement('div');
        item.className = 'key-item';
        item.innerHTML = `
          <div class="circle" style="background-color: ${currentColorMap[char]}"></div>
          <span>${char}</span>
        `;
        keyBoardEl.appendChild(item);
      });

      // 3. Tampilkan Kode Lingkaran Warna Soal (Sesuai urutan huruf kata asli)
      colorCodeDisplayEl.innerHTML = '';
      for (let char of currentWord) {
        const circle = document.createElement('div');
        circle.className = 'circle';
        circle.style.backgroundColor = currentColorMap[char] || '#ccc';
        colorCodeDisplayEl.appendChild(circle);
      }

      // 4. ACAK TOMBOL KEYBOARD LAYAR agar posisi tombol tidak menebak urutan
      const shuffledKeyboardChars = shuffleArray(uniqueChars);
      keyboardEl.innerHTML = '';
      shuffledKeyboardChars.forEach(char => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = char;
        btn.onclick = () => {
          answerInputEl.value += char;
        };
        keyboardEl.appendChild(btn);
      });

      // Tombol Hapus
      const delBtn = document.createElement('button');
      delBtn.className = 'key-btn del';
      delBtn.textContent = '⌫ Hapus';
      delBtn.onclick = () => {
        answerInputEl.value = answerInputEl.value.slice(0, -1);
      };
      keyboardEl.appendChild(delBtn);
    }

    // Pengecekan Jawaban
    checkBtn.addEventListener('click', () => {
      const userAnswer = answerInputEl.value.toLowerCase().trim();

      if (userAnswer === currentWord) {
        feedbackEl.textContent = `Hebat ${playerName}! Jawaban Benar! 🎉`;
        feedbackEl.style.color = "#06d6a0";

        setTimeout(() => {
          currentWordIndex++;
          if (currentWordIndex >= levels[currentLevelIndex].words.length) {
            currentWordIndex = 0;
            currentLevelIndex = (currentLevelIndex + 1) % levels.length;
            alert(`Hore ${playerName}! Kamu Lanjut ke Tingkat Berikutnya! 🌟`);
          }
          loadWord();
        }, 1200);
      } else {
        feedbackEl.textContent = "Coba lagi ya! 😊";
        feedbackEl.style.color = "#ef476f";
      }
    });
  </script>
</body>
</html>
