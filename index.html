html_content = """<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Kode Warna - Belajar Membaca</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .game-container {
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 500px;
      width: 100%;
      position: relative;
    }

    h1 {
      color: #333;
      font-size: 1.6rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* Section Control */
    .page {
      display: none;
    }
    .page.active {
      display: block;
    }

    /* 1. Landing Page Style */
    .landing-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .input-name-box {
      font-size: 1.2rem;
      width: 80%;
      text-align: center;
      border: 3px solid #4A90E2;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 20px;
      outline: none;
    }

    /* 2. Level Select Page Style */
    .level-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .level-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .level-card.unlocked {
      border-color: #4A90E2;
      background-color: #f0f7ff;
    }

    .level-card.unlocked:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.2);
    }

    .level-card.locked {
      opacity: 0.6;
      cursor: not-allowed;
      background-color: #edf2f7;
    }

    .level-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: #2d3748;
    }

    .level-status {
      font-size: 1.2rem;
    }

    /* 3. Game Play Page Style */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .back-btn {
      background: #e2e8f0;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .greeting {
      font-size: 1rem;
      font-weight: bold;
      color: #4A90E2;
    }

    .level-badge {
      display: inline-block;
      background-color: #ffb703;
      color: #333;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .key-section {
      background-color: #fafafa;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      padding: 15px 10px;
      margin-bottom: 20px;
    }

    .key-title {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .key-board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .key-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.15);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
    }

    .key-item span {
      margin-top: 4px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #1e293b;
    }

    .color-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
      min-height: 48px;
      align-items: center;
    }

    .equals {
      font-size: 2rem;
      font-weight: bold;
      color: #64748b;
      margin: 0 8px;
    }

    .answer-box {
      font-size: 1.6rem;
      width: 150px;
      text-align: center;
      border: 3px solid #4A90E2;
      border-radius: 12px;
      padding: 8px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: lowercase;
      outline: none;
      background-color: #f8fafc;
    }

    .action-btn {
      font-size: 1.1rem;
      padding: 12px 28px;
      background-color: #06d6a0;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #04b383;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #04b383;
    }

    #feedback {
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 12px;
    }

    .keyboard-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #f1f5f9;
    }

    .key-btn {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #1e293b;
      cursor: pointer;
      box-shadow: 0 3px 0 #94a3b8;
    }

    .key-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .key-btn.del {
      background-color: #ff85a1;
      border-color: #e65c7b;
      color: white;
      box-shadow: 0 3px 0 #c9405f;
    }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- 1. LANDING PAGE -->
    <div id="landing-page" class="page active">
      <div class="landing-icon">🎨📚</div>
      <h1>Game Kode Warna</h1>
      <p class="subtitle">Belajar Membaca Sambil Bermain Warna</p>
      
      <input type="text" id="player-name-input" class="input-name-box" placeholder="Ketik Nama Anak..." autocomplete="off">
      <br>
      <button id="start-btn" class="action-btn">Mulai Bermain 🚀</button>
    </div>

    <!-- 2. LEVEL SELECT PAGE -->
    <div id="level-page" class="page">
      <h2 style="margin-top:0;">Pilih Level</h2>
      <p id="welcome-user" class="subtitle">Halo Anak Hebat!</p>
      
      <div id="level-grid" class="level-grid">
        <!-- Level cards rendered dynamically -->
      </div>
    </div>

    <!-- 3. GAME PLAY PAGE -->
    <div id="game-page" class="page">
      <div class="top-bar">
        <button id="back-to-levels" class="back-btn">⬅ Level</button>
        <span id="greeting-msg" class="greeting">Halo!</span>
      </div>

      <div id="level-badge" class="level-badge">Level 1</div>

      <!-- Kunci Kode Warna -->
      <div class="key-section">
        <div class="key-title">Kunci Huruf Warna</div>
        <div id="color-key" class="key-board"></div>
      </div>

      <!-- Soal -->
      <div class="question-section">
        <div id="color-code-display" class="color-row"></div>
        <div style="display: flex; justify-content: center; align-items: center; gap: 8px;">
          <span class="equals">=</span>
          <input type="text" id="answer-input" class="answer-box" placeholder="..." readonly>
        </div>
        <div style="margin-top: 15px;">
          <button id="check-btn" class="action-btn">Cek Jawaban</button>
        </div>
      </div>

      <!-- Keyboard Layar -->
      <div id="keyboard" class="keyboard-container"></div>

      <!-- Feedback Hasil -->
      <div id="feedback"></div>
    </div>

  </div>

  <script>
    // System Web Audio API untuk Efek Suara
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now); // A3
        osc.frequency.setValueAtTime(164.81, now + 0.15); // E3
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'unlock') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.1);
        osc.frequency.setValueAtTime(659.25, now + 0.2);
        osc.frequency.setValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // Palette Warna Kontras Tinggi Teruji
    const distinctColors = [
      '#FF0000', // Merah Terang
      '#0033FF', // Biru Tua
      '#00CC44', // Hijau Cerah
      '#FFD700', // Kuning Emas
      '#FF00FF', // Magenta/Pink
      '#00FFFF', // Cyan/Biru Muda
      '#FF6600', // Oranye Pekat
      '#7000FF', // Ungu
      '#8B4513'  // Cokelat
    ];

    // Level Data
    const levels = [
      {
        id: 0,
        name: "Level 1: Kata 2-3 Huruf",
        words: ["ibu", "apa", "ada", "ani", "api", "uap"]
      },
      {
        id: 1,
        name: "Level 2: Kata 4 Huruf Sederhana",
        words: ["baca", "buku", "bola", "kaki", "mata", "sapu", "cuci"]
      },
      {
        id: 2,
        name: "Level 3: Kombinasi Kata 4 Huruf",
        words: ["peta", "rusa", "satu", "topi", "kura", "roda"]
      },
      {
        name: "Level 4: Kata 5 Huruf Mantap",
        id: 3,
        words: ["makan", "minum", "gajah", "rumah", "pohon", "hujan"]
      }
    ];

    // Game State
    let playerName = "";
    let unlockedLevel = 0; // Level tertinggi yang terbuka
    let currentLevelIndex = 0;
    let currentWordIndex = 0;
    let currentWord = "";
    let currentColorMap = {};

    // Element DOM
    const pages = {
      landing: document.getElementById('landing-page'),
      level: document.getElementById('level-page'),
      game: document.getElementById('game-page')
    };

    const playerNameInput = document.getElementById('player-name-input');
    const startBtn = document.getElementById('start-btn');
    const welcomeUserEl = document.getElementById('welcome-user');
    const levelGridEl = document.getElementById('level-grid');
    const backToLevelsBtn = document.getElementById('back-to-levels');
    const greetingMsg = document.getElementById('greeting-msg');
    
    const keyBoardEl = document.getElementById('color-key');
    const colorCodeDisplayEl = document.getElementById('color-code-display');
    const answerInputEl = document.getElementById('answer-input');
    const checkBtn = document.getElementById('check-btn');
    const feedbackEl = document.getElementById('feedback');
    const levelBadgeEl = document.getElementById('level-badge');
    const keyboardEl = document.getElementById('keyboard');

    function showPage(pageName) {
      Object.keys(pages).forEach(p => {
        pages[p].classList.remove('active');
      });
      pages[pageName].classList.add('active');
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Event: Start Game
    startBtn.addEventListener('click', () => {
      initAudio();
      playSound('click');
      playerName = playerNameInput.value.trim() || "Anak Hebat";
      welcomeUserEl.textContent = `Halo ${playerName}, pilih level kamu ya!`;
      renderLevelSelect();
      showPage('level');
    });

    // Render Halaman Pilih Level
    function renderLevelSelect() {
      levelGridEl.innerHTML = '';
      levels.forEach((lvl, idx) => {
        const card = document.createElement('div');
        const isUnlocked = idx <= unlockedLevel;
        
        card.className = `level-card ${isUnlocked ? 'unlocked' : 'locked'}`;
        card.innerHTML = `
          <div class="level-title">${lvl.name}</div>
          <div class="level-status">${isUnlocked ? '🔓' : '🔒'}</div>
        `;

        if (isUnlocked) {
          card.onclick = () => {
            playSound('click');
            currentLevelIndex = idx;
            currentWordIndex = 0;
            startLevel();
          };
        } else {
          card.onclick = () => {
            playSound('wrong');
          };
        }
        levelGridEl.appendChild(card);
      });
    }

    backToLevelsBtn.addEventListener('click', () => {
      playSound('click');
      renderLevelSelect();
      showPage('level');
    });

    function startLevel() {
      greetingMsg.textContent = `Pemain: ${playerName}`;
      showPage('game');
      loadWord();
    }

    function loadWord() {
      const levelData = levels[currentLevelIndex];
      levelBadgeEl.textContent = `${levelData.name} (${currentWordIndex + 1}/${levelData.words.length})`;
      currentWord = levelData.words[currentWordIndex];

      answerInputEl.value = '';
      feedbackEl.textContent = '';

      const uniqueChars = Array.from(new Set(currentWord.split('')));
      
      // 1. Pilih warna kontras tinggi yang berbeda untuk tiap huruf
      const shuffledColors = shuffleArray(distinctColors);
      currentColorMap = {};
      uniqueChars.forEach((char, idx) => {
        currentColorMap[char] = shuffledColors[idx % shuffledColors.length];
      });

      // 2. Tampilkan kunci warna diacak
      const shuffledKeyChars = shuffleArray(uniqueChars);
      keyBoardEl.innerHTML = '';
      shuffledKeyChars.forEach(char => {
        const item = document.createElement('div');
        item.className = 'key-item';
        item.innerHTML = `
          <div class="circle" style="background-color: ${currentColorMap[char]}"></div>
          <span>${char}</span>
        `;
        keyBoardEl.appendChild(item);
      });

      // 3. Tampilkan Soal Kode Warna
      colorCodeDisplayEl.innerHTML = '';
      for (let char of currentWord) {
        const circle = document.createElement('div');
        circle.className = 'circle';
        circle.style.backgroundColor = currentColorMap[char] || '#ccc';
        colorCodeDisplayEl.appendChild(circle);
      }

      // 4. Keyboard Layar
      const shuffledKeyboardChars = shuffleArray(uniqueChars);
      keyboardEl.innerHTML = '';
      shuffledKeyboardChars.forEach(char => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = char;
        btn.onclick = () => {
          playSound('click');
          answerInputEl.value += char;
        };
        keyboardEl.appendChild(btn);
      });

      // Tombol Hapus
      const delBtn = document.createElement('button');
      delBtn.className = 'key-btn del';
      delBtn.textContent = '⌫ Hapus';
      delBtn.onclick = () => {
        playSound('click');
        answerInputEl.value = answerInputEl.value.slice(0, -1);
      };
      keyboardEl.appendChild(delBtn);
    }

    // Cek Jawaban
    checkBtn.addEventListener('click', () => {
      const userAnswer = answerInputEl.value.toLowerCase().trim();

      if (userAnswer === currentWord) {
        playSound('correct');
        feedbackEl.textContent = `Hebat ${playerName}! Jawaban Benar! 🎉`;
        feedbackEl.style.color = "#06d6a0";

        setTimeout(() => {
          currentWordIndex++;
          const currentLevelData = levels[currentLevelIndex];

          // Jika selesai semua kata di level ini
          if (currentWordIndex >= currentLevelData.words.length) {
            currentWordIndex = 0;
            
            // Buka level berikutnya jika ada
            if (currentLevelIndex + 1 < levels.length) {
              if (unlockedLevel < currentLevelIndex + 1) {
                unlockedLevel = currentLevelIndex + 1;
                playSound('unlock');
              }
              alert(`Hore ${playerName}! Kamu menyelesaikan ${currentLevelData.name}! Level berikutnya telah terbuka! 🌟`);
            } else {
              alert(`Luar biasa ${playerName}! Kamu telah menamatkan SEMUA level! 🏆`);
            }
            renderLevelSelect();
            showPage('level');
          } else {
            loadWord();
          }
        }, 1000);
      } else {
        playSound('wrong');
        feedbackEl.textContent = "Coba lagi ya! 😊";
        feedbackEl.style.color = "#ef476f";
      }
    });
  </script>
</body>
</html>
"""

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html_content)
